name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build ARMv7 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv

      - name: Show versions
        run: |
          python --version
          buildozer --version
          java -version

      - name: Clean previous Buildozer build
        run: |
          rm -rf .buildozer bin

      - name: Accept Android SDK licenses
        run: |
          yes | buildozer android update || true

      - name: Build ARMv7 debug APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
        run: |
          buildozer -v android debug

 
      - name: Repair NDK compiler permissions if build failed
        if: failure()
        run: |
          set -x

          for dir in \
            "$HOME/.buildozer" \
            "$GITHUB_WORKSPACE/.buildozer" \
            "/home/runner/.buildozer"; do
            if [ -d "$dir" ]; then
              echo "Repairing executables in: $dir"
              find "$dir" -type f \( \
                -name "clang*" -o \
                -name "clang++*" -o \
                -name "llvm-*" -o \
                -name "ld*" -o \
                -name "gcc*" \
              \) -exec chmod +x {} \;
            else
              echo "Skipping missing directory: $dir"
            fi
          done

      - name: Retry build after repairing NDK permissions
        if: failure()
        run: |
          rm -rf .buildozer/android/platform/build-armeabi-v7a
          buildozer -v android debug
      
      

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stl127-armv7-debug-apk
          path: |
            bin/*.apk
          if-no-files-found: error
